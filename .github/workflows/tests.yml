name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: [12, 13]
        include:
          - laravel: 12
            testbench: '^10.0'
          - laravel: 13
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The wire-contract fixtures are a dev dependency resolved from a path
      # repository at ../ranetrace-php (see composer.json). That repository is
      # private, so this step needs the CONTRACT_REPO_TOKEN secret (a token
      # with read access to ranetrace/ranetrace-php). This whole step goes away
      # once ranetrace-php is on Packagist and the dev dependency becomes a
      # version constraint.
      - name: Checkout ranetrace-php (wire-contract dev dependency)
        uses: actions/checkout@v4
        with:
          repository: ranetrace/ranetrace-php
          token: ${{ secrets.CONTRACT_REPO_TOKEN || github.token }}
          path: .ranetrace-php-checkout

      - name: Place ranetrace-php beside this checkout
        run: mv .ranetrace-php-checkout ../ranetrace-php

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, libxml, fileinfo, intl
          coverage: none

      - name: Constrain to Laravel ${{ matrix.laravel }}
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --with-all-dependencies --no-interaction --no-scripts

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests (Pest)
        run: vendor/bin/pest --compact --exclude-testsuite=Browser
